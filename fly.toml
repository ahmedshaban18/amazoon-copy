
app = "amazoon-copy"

[build]
  builder = "heroku/builder:22"
[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  
[[mounts]]
  source = "uploads"
  destination = "/project/uploads"
